[project]
name = "stemsep"
version = "0.1.0"
description = "Faster HTDemucs inference on Modal GPUs: batched chunks, mixed precision, compile and ONNX backends"
readme = "README.md"
authors = [
    { name = "Dawson", email = "dawsonxiong@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "demucs==4.0.1",
    "lameenc>=1.8",
    "numpy>=2.4.6",
    "soundfile>=0.13",
    "torch>=2.3",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.18",
    "onnxruntime>=1.22",
    "onnxscript>=0.5",
]
onnx-gpu = [
    "onnx>=1.18",
    "onnxruntime-gpu[cuda,cudnn]>=1.30 ; sys_platform == 'linux'",
    "onnxscript>=0.5",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "modal==1.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["slow: exports or runs a whole model (deselect with -m 'not slow')"]
