[project]
name = "stemsep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dawson", email = "dawsonxiong@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "demucs==4.0.1",
    "numpy>=2.4.6",
    "torch>=2.3",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "modal==1.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "pytest>=9.1.1",
]
